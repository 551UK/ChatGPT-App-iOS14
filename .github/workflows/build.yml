name: Build iOS 14 packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [jailbroken, trollstore]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install pillow lief
      - name: Theos and private SDK for rootful preference bundle
        if: matrix.flavor == 'jailbroken'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk"
          ln -s "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$RUNNER_TEMP/theos/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build and verify
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error
      - name: Publish verified IPA to Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          cd dist
          case "$FLAVOR" in
            jailbroken) assets=(ChatGPT-Gecko-iOS14-Rootful.ipa com.551uk.chatgptgecko14_0.19.0-13014_iphoneos-arm.deb);;
            trollstore) assets=(ChatGPT-Gecko-iOS14-TrollStore.ipa ChatGPT-Gecko-iOS14-TrollStore.tipa);;
            *) exit 1;;
          esac
          for asset in "${assets[@]}"; do
            test -s "$asset"
            case "$asset" in *.ipa|*.tipa) unzip -tq "$asset";; esac
          done
          tag="ios14-v1.30-beta.${GITHUB_RUN_NUMBER}-$FLAVOR"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "ChatGPT iOS 14 v1.30 beta ($FLAVOR, build ${GITHUB_RUN_NUMBER})" --prerelease --notes "Experimental iOS 14.0+ port. Build and archive checks passed; real iOS 14.3 device testing remains necessary. Use the jailbroken variant on rootful iOS 14; TrollStore variant is an alternative. Install only one variant."
          fi
