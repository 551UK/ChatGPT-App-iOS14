name: Clean obsolete releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-old-releases.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ["Build iOS 14 packages"]
    types: [completed]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove old v1.30 releases and non-IPA assets
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | while IFS= read -r tag; do
            if [[ "$tag" == ios14-v1.30-beta.* ]]; then
              gh release delete "$tag" --yes
            elif [[ "$tag" == ios14-v* ]]; then
              gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
                if [[ "$asset" != *.ipa ]]; then
                  gh release delete-asset "$tag" "$asset" --yes
                fi
              done
            fi
          done
          gh api "repos/$GH_REPO/releases" --jq '.[] | {tag_name, assets: [.assets[].name]}'
