name: Clean obsolete releases and tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-old-releases.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep only latest complete IPA release and its tag
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GH_REPO/releases?per_page=100")
          keep=$(jq -r '[.[] | select(.tag_name | startswith("ios14-v")) | select(.draft == false) | select(([.assets[] | select(.state == "uploaded") | .name] | sort) == ["ChatGPT-Gecko-iOS14-Rootful.ipa","ChatGPT-Gecko-iOS14-TrollStore.ipa"])] | sort_by(.published_at) | last | .tag_name // empty' <<< "$releases")
          test -n "$keep"
          echo "Keeping $keep"
          jq -r '.[].tag_name' <<< "$releases" | while IFS= read -r old; do
            if [[ "$old" == ios14-v* && "$old" != "$keep" ]]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/ios14-v" --jq '.[].ref' | while IFS= read -r ref; do
            if [[ "$ref" == refs/tags/ios14-v* && "$ref" != "refs/tags/$keep" ]]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/${ref#refs/}"
            fi
          done
          gh api "repos/$GH_REPO/git/matching-refs/tags/ios14-v" --jq '.[].ref' | tee remaining-tags.txt
          test "$(cat remaining-tags.txt)" = "refs/tags/$keep"
