name: Build and release iOS 14 IPAs
on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'scripts/**', 'prefs/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios14-ipa-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [jailbroken, trollstore]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          brew install ldid
          python3 -m pip install pillow lief
      - name: Build and verify IPA
        env:
          FLAVOR: ${{ matrix.flavor }}
          IPA_ONLY: '1'
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-${{ matrix.flavor }}
          path: dist/*.ipa
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    concurrency:
      group: ipa-release-publishing
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ChatGPT-iOS14-*
          merge-multiple: true
          path: release-assets
      - name: Publish current IPAs and remove superseded releases
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          assets=(ChatGPT-Gecko-iOS14-Rootful.ipa ChatGPT-Gecko-iOS14-TrollStore.ipa)
          for file in "${assets[@]}"; do
            test -s "$file"
            unzip -tq "$file"
          done
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded build"; exit 0
          fi
          tag="IPA"
          notes="Reynard 0.22.1 / Gecko 160.0. Two IPA variants only; install one. Rootful IPA is recommended for jailbroken iOS 14.3. Experimental; device compatibility is not yet verified. Build commit: $GITHUB_SHA."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "RELEASE" --draft --prerelease --notes "$notes"
          fi
          gh release view "$tag" --json assets --jq '.assets | map(select(.state == "uploaded") | .name) | sort' > uploaded.json
          jq -e '. == ["ChatGPT-Gecko-iOS14-Rootful.ipa","ChatGPT-Gecko-iOS14-TrollStore.ipa"]' uploaded.json
          gh release edit "$tag" --draft=false --notes "$notes"
          gh release view "$tag" --json isDraft --jq '.isDraft == false' | grep -qx true
          # Remove superseded project releases and their tags.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' | while IFS= read -r old; do
            if [[ "$old" == ios14-v* && "$old" != "$tag" ]]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done
          # Remove orphaned tags left by historical releases.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/ios14-v" --jq '.[].ref' | while IFS= read -r ref; do
            if [[ "$ref" == refs/tags/ios14-v* && "$ref" != "refs/tags/$tag" ]]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/${ref#refs/}"
            fi
          done
          gh api "repos/$GH_REPO/git/matching-refs/tags/ios14-v" --jq '.[].ref'
