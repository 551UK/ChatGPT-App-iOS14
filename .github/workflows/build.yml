name: Build iOS 14 packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [jailbroken, trollstore]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          brew install ldid dpkg
          python3 -m pip install pillow lief
      - name: Theos and private SDK for rootful preference bundle
        if: matrix.flavor == 'jailbroken'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk"
          ln -s "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$RUNNER_TEMP/theos/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build and verify
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error
  release:
    name: Publish iOS 14 IPA release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChatGPT-iOS14-jailbroken
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ChatGPT-iOS14-trollstore
          path: release-assets
      - name: Verify archives and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for ipa in ChatGPT-Gecko-iOS14-Rootful.ipa ChatGPT-Gecko-iOS14-TrollStore.ipa ChatGPT-Gecko-iOS14-TrollStore.tipa; do
            test -s "$ipa"
            unzip -tq "$ipa"
          done
          tag="ios14-v1.30-beta.${GITHUB_RUN_NUMBER}"
          assets=(ChatGPT-Gecko-iOS14-Rootful.ipa ChatGPT-Gecko-iOS14-TrollStore.ipa ChatGPT-Gecko-iOS14-TrollStore.tipa)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "ChatGPT iOS 14 v1.30 beta (${GITHUB_RUN_NUMBER})" --prerelease --notes "Experimental iOS 14.0+ port. Start with Rootful.ipa on jailbroken iOS 14.3. TrollStore IPA/TIPA is an alternative; install only one variant. Build checks passed; physical device compatibility is not yet verified."
          fi
